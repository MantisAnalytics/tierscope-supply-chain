[project]
name = "supplyagent"
version = "0.1.0"
description = "Exports ShockBench-Flow shortage curves and event episodes for Tierscope"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.41.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "shockbench-flow[gym]==0.1.2",
]

[project.scripts]
supplyagent = "supplyagent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long prompt strings; the formatter wraps code
